<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funciones que retornan un valor</title>
</head>
<body>
    <script>
        function convertirCastellano(x) {
            switch (x) {
                case 1:
                    return "uno";
                case 2:
                    return "dos";
                case 3:
                    return "tres";
                case 4:
                    return "cuatro";
                case 5:
                    return "cinco";
                default:
                    return "valor incorrecto";
            }
        }
    </script>
    
</body>
</html>
